<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#08080A" />
<meta name="description" content="SYNAPTIC ARCHIVE — 四つの異なる現実をつなぐ、高速度のデジタル次元接合点。Vector Flow Theory による総合ポータル。" />
<meta property="og:title" content="SYNAPTIC ARCHIVE" />
<meta property="og:description" content="四つの特設サイトを束ねる、ベクター幾何学とタイポグラフィの重力で構成された総合サイト。" />
<meta property="og:type" content="website" />
<title>SYNAPTIC ARCHIVE — Vector Flow Theory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Serif+JP:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080A;
  --fg:#F2F2F2;
  --accent:#8E9AAF;
  --font-display:"Cormorant Garamond","Noto Serif JP",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Noto Serif JP",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
::selection{background:#8E9AAF;color:#08080A}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#08080A}
::-webkit-scrollbar-thumb{background:rgba(242,242,242,.2)}
::-webkit-scrollbar-thumb:hover{background:rgba(242,242,242,.4)}

/* ===== Shutter Transition ===== */
.shutter{position:fixed;inset:0;z-index:100;pointer-events:none}
.shutter .panel{position:absolute;left:0;right:0;height:51%;background:#08080A;transition:transform .9s cubic-bezier(.16,1,.3,1)}
.shutter .top{top:0}
.shutter .bot{bottom:0}
.shutter.open .top{transform:translateY(-101%)}
.shutter.open .bot{transform:translateY(101%)}
.shutter .seam{position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(242,242,242,.3);transform:scaleX(0);transform-origin:center;transition:transform .5s ease}
.shutter .seam.show{transform:scaleX(1)}
.shutter .label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:rgba(242,242,242,.6);opacity:0;transition:opacity .4s ease .2s}
.shutter .label.show{opacity:1}
.shutter.gone{opacity:0;transition:opacity .6s ease}
.shutter.gone .label{opacity:0}

/* ===== Cursor Distortion ===== */
.cursor{position:fixed;top:0;left:0;width:40px;height:40px;border:1px solid rgba(242,242,242,.7);border-radius:50%;pointer-events:none;z-index:60;mix-blend-mode:difference;transform:translate(-50%,-50%);transition:width .3s,height .3s;display:none}
.cursor .dot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cursor .dot::after{content:"";width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.8)}
@media(pointer:fine){.cursor{display:block}}

/* ===== Persistent HUD ===== */
.hud{position:fixed;inset:0;z-index:50;pointer-events:none;user-select:none}
.hud .quad{position:absolute;padding:20px}
@media(min-width:640px){.hud .quad{padding:32px}}
.hud .tl{top:0;left:0;display:flex;align-items:center;gap:12px}
.hud .tr{top:0;right:0;text-align:right}
.hud .bl{bottom:0;left:0}
.hud .br{bottom:0;right:0;text-align:right}
.hud .gear{width:22px;height:22px;animation:spin 18s linear infinite;color:var(--accent);transition:color .6s}
.hud .gear svg{display:block}
.hud .ttl{font-family:var(--font-mono);font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);transition:color .6s;line-height:1}
.hud .sub{font-family:var(--font-mono);font-size:8px;letter-spacing:.25em;text-transform:uppercase;color:rgba(242,242,242,.4);margin-top:2px}
.hud .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(242,242,242,.5)}
.hud .cnt{font-family:var(--font-mono);font-size:24px;font-weight:300;line-height:1;color:var(--accent);transition:color .6s;margin-top:4px;tabular-nums:1;font-variant-numeric:tabular-nums}
.hud .cnt .of{color:rgba(242,242,242,.25);font-size:16px}
.hud .time{font-family:var(--font-mono);font-size:11px;letter-spacing:.15em;color:rgba(242,242,242,.7);font-variant-numeric:tabular-nums}
.hud .status{display:flex;align-items:center;gap:6px;margin-top:8px}
.hud .status .led{width:6px;height:6px;border-radius:50%;background:var(--accent);transition:background .6s;animation:pulse 2s infinite}
.hud .status span{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,242,242,.5)}
.hud .cta{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);transition:color .6s}
@media(min-width:640px){.hud .cnt{font-size:40px}.hud .cnt .of{font-size:20px}}
.hud .brk{position:absolute;width:16px;height:16px;border-color:var(--accent);opacity:.5;transition:border-color .6s}
@media(min-width:640px){.hud .brk{width:24px;height:24px}}
.hud .brk.tl2{top:8px;left:8px;border-top:1px solid;border-left:1px solid}
.hud .brk.tr2{top:8px;right:8px;border-top:1px solid;border-right:1px solid}
.hud .brk.bl2{bottom:8px;left:8px;border-bottom:1px solid;border-left:1px solid}
.hud .brk.br2{bottom:8px;right:8px;border-bottom:1px solid;border-right:1px solid}

/* ===== Global leak background ===== */
.leak{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 100%,rgba(142,154,175,.08),transparent 60%);transition:background .8s ease}

/* ===== Filament Path ===== */
.filament{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;overflow:hidden}
.filament svg{position:absolute;inset:0;width:100%;height:100%}
.filament path{stroke:var(--accent);transition:stroke .6s;stroke-dasharray:4 8}

/* ===== Nexus Hero ===== */
.hero{position:relative;height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#08080A;z-index:2}
.hero .rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hero .ring{position:absolute;border:1px solid rgba(242,242,242,.05);border-radius:50%;animation:breathe 6s ease-in-out infinite}
.hero .dial{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);animation:spin 40s linear infinite;opacity:.3}
.hero .dial svg{display:block}
.hero .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:rgba(242,242,242,.4);margin-bottom:24px;opacity:0;animation:fadeUp .8s ease .8s forwards}
.hero h1{font-family:var(--font-display);font-weight:300;line-height:.9;letter-spacing:-.02em;font-size:clamp(2.8rem,11vw,11rem);opacity:0;animation:fadeUp 1s ease 1s forwards}
.hero h1 .a{display:block;color:rgba(242,242,242,.9)}
.hero h1 .b{display:block;color:rgba(242,242,242,.3)}
.hero p{margin-top:32px;max-width:36rem;margin-left:auto;margin-right:auto;text-align:center;color:rgba(242,242,242,.5);font-size:15px;line-height:1.7;opacity:0;animation:fadeIn 1s ease 1.4s forwards}
.hero .scroll{margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fadeIn 1s ease 1.8s forwards}
.hero .scroll span{font-family:var(--font-mono);font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:rgba(242,242,242,.4)}
.hero .scroll .bar{width:1px;height:48px;background:linear-gradient(to bottom,rgba(242,242,242,.4),transparent);transform-origin:top;animation:drip 2s ease-in-out infinite}

/* ===== Project Section ===== */
.proj{position:relative;height:100vh;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:2}
.proj .warp{position:absolute;inset:0;overflow:hidden}
.proj .bleed{position:absolute;bottom:0;left:0;right:0;height:50%;pointer-events:none;opacity:0;transition:opacity .4s}
.proj .idx{position:absolute;top:50%;left:16px;transform:translateY(-50%);font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--p-accent)}
@media(min-width:640px){.proj .idx{left:40px}}
.proj .cluster{position:relative;z-index:10;padding:0 16px;text-align:center;will-change:transform}
.proj .skew{transform-origin:center;will-change:transform}
.proj .ttl-link{text-decoration:none;color:inherit;display:inline-block}
.proj .ttl{font-family:var(--font-display);font-weight:300;line-height:.85;letter-spacing:-.02em;font-size:clamp(2.5rem,18vw,22rem);color:#F2F2F2;transition:color .3s,-webkit-text-stroke .3s;will-change:transform;display:inline-block}
.proj .ttl.hollow{color:transparent;-webkit-text-stroke:1.5px var(--p-accent)}
.proj .sub{margin-top:20px;font-family:var(--font-mono);font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--p-accent)}
@media(min-width:640px){.proj .sub{margin-top:24px;font-size:14px}}
.proj .desc{margin-top:20px;max-width:28rem;margin-left:auto;margin-right:auto;color:rgba(242,242,242,.5);font-size:14px;line-height:1.6}
@media(min-width:640px){.proj .desc{font-size:16px}}
.proj .enter{display:inline-flex;align-items:center;gap:12px;margin-top:32px;padding:12px 24px;border:1px solid var(--p-accent);color:var(--p-accent);font-family:var(--font-mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;text-decoration:none;transition:all .3s;min-height:44px;cursor:pointer;background:transparent;appearance:none;-webkit-appearance:none}
.proj .enter:hover{background:var(--p-accent);color:#08080A}
.proj .enter svg{transition:transform .3s}
.proj .enter:hover svg{transform:translateX(4px)}
.proj .meta{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(242,242,242,.3);white-space:nowrap;text-align:center;width:90%}

/* ===== Dimension Viewer (in-site iframe) ===== */
.viewer{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:#08080A;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility .5s ease}
.viewer.open{opacity:1;visibility:visible;pointer-events:auto}
.viewer .bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid rgba(242,242,242,.08);background:rgba(8,8,10,.95);backdrop-filter:blur(12px)}
@media(min-width:640px){.viewer .bar{padding:14px 24px}}
.viewer .bar-left{display:flex;align-items:center;gap:12px;min-width:0}
.viewer .bar-idx{font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;color:var(--v-accent,#8E9AAF);flex-shrink:0}
.viewer .bar-ttl{font-family:var(--font-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(242,242,242,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .bar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.viewer .bar-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border:1px solid rgba(242,242,242,.25);background:transparent;color:rgba(242,242,242,.7);font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .25s;min-height:40px;text-decoration:none}
.viewer .bar-btn:hover{border-color:var(--v-accent,#8E9AAF);color:var(--v-accent,#8E9AAF)}
.viewer .bar-btn.exit:hover{border-color:#F2F2F2;color:#F2F2F2;background:rgba(242,242,242,.06)}
.viewer .frame-wrap{flex:1;position:relative;min-height:0;background:#000}
.viewer .frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#08080A}
.viewer .loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#08080A;z-index:2;transition:opacity .4s ease}
.viewer .loader.hide{opacity:0;pointer-events:none}
.viewer .loader .spin{width:28px;height:28px;border:1px solid rgba(242,242,242,.15);border-top-color:var(--v-accent,#8E9AAF);border-radius:50%;animation:spin 1s linear infinite}
.viewer .loader span{font-family:var(--font-mono);font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:rgba(242,242,242,.4)}
body.viewing{overflow:hidden}
body.viewing .hud{opacity:0;pointer-events:none;transition:opacity .3s}
body.viewing .cursor{display:none}

/* ===== Warp Effects ===== */
/* particles */
.warp-particles .p{position:absolute;border-radius:50%;background:var(--p-accent);opacity:0}
/* ticker */
.warp-ticker{display:flex;flex-direction:column;justify-content:center;gap:6px;height:100%}
.warp-ticker .row{display:flex;gap:32px;white-space:nowrap;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--p-accent)}
.warp-ticker .row .up{color:rgba(52,211,153,.6)}
.warp-ticker .row .dn{color:rgba(248,113,113,.6)}
.warp-ticker .row .sep{color:rgba(242,242,242,.3);margin:0 6px}
/* pulse */
.warp-pulse{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 4px;padding:32px;height:100%}
.warp-pulse .c{font-family:var(--font-mono);font-size:16px;color:var(--p-accent);opacity:0}
/* grid */
.warp-grid{padding:24px;height:100%}
@media(min-width:640px){.warp-grid{padding:40px}}
.warp-grid .grid{display:grid;grid-template-columns:repeat(16,1fr);gap:1px;width:100%;height:100%}
.warp-grid .cell{border:.5px solid rgba(110,110,110,.13);opacity:0}
.warp-grid .cell.on{background:var(--p-accent)}
.warp-grid .scope{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0}
.warp-grid .scope svg{display:block;animation:spin 24s linear infinite}

/* ===== Closing ===== */
.close{position:relative;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 24px;text-align:center;overflow:hidden;z-index:2}
.close .csvg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.15}
.close .csvg svg{display:block}
.close .wrap{position:relative;z-index:10;max-width:36rem}
.close .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:rgba(242,242,242,.4);margin-bottom:24px}
.close h3{font-family:var(--font-display);font-weight:300;font-size:clamp(1.875rem,5vw,3rem);line-height:1.2;color:rgba(242,242,242,.9)}
.close p{margin-top:24px;color:rgba(242,242,242,.5);font-size:15px;line-height:1.7}
.close .links{margin-top:40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}
.close .links a{font-family:var(--font-mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;padding:8px 16px;border:1px solid var(--lk);color:var(--lk);text-decoration:none;transition:all .3s}
.close .links a:hover{background:#F2F2F2;color:#08080A}
.close .foot{margin-top:64px;font-family:var(--font-mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(242,242,242,.25)}

/* ===== Animations ===== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.05);opacity:.5}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drip{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes float{0%,100%{transform:translateY(0);opacity:.15}50%{opacity:.6}}
@keyframes drift{to{transform:translateX(-50%)}}
@keyframes driftR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
</style>
</head>
<body>

<!-- Shutter -->
<div class="shutter" id="shutter">
  <div class="panel top"></div>
  <div class="panel bot"></div>
  <div class="seam" id="seam"></div>
  <div class="label" id="shutterLabel">Initializing Nexus</div>
</div>

<!-- Cursor -->
<div class="cursor" id="cursor"><div class="dot"></div></div>

<!-- Leak background -->
<div class="leak" id="leak"></div>

<!-- Filament -->
<div class="filament" id="filament">
  <svg viewBox="0 0 1440 4000" preserveAspectRatio="xMidYMin slice" fill="none">
    <path id="fil1" d="M720,0 C720,200 200,400 720,600 C1240,800 200,1000 720,1200 C1240,1400 200,1600 720,1800 C1240,2000 200,2200 720,2400 C1240,2600 200,2800 720,3000 C1240,3200 720,3400 720,4000" stroke-width="1" stroke-opacity=".25" style="stroke-dasharray:none"/>
    <path id="fil2" d="M720,0 C720,200 200,400 720,600 C1240,800 200,1000 720,1200 C1240,1400 200,1600 720,1800 C1240,2000 200,2200 720,2400 C1240,2600 200,2800 720,3000 C1240,3200 720,3400 720,4000" stroke-width=".5" stroke-opacity=".5"/>
  </svg>
</div>

<!-- HUD -->
<div class="hud" id="hud">
  <div class="quad tl">
    <div class="gear">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <circle cx="11" cy="11" r="10" fill="none" stroke="currentColor" stroke-width=".5"/>
        <circle cx="11" cy="1" r="1.2" fill="currentColor"/>
      </svg>
    </div>
    <div>
      <div class="ttl">Synaptic Archive</div>
      <div class="sub">Vector Flow Theory</div>
    </div>
  </div>
  <div class="quad tr">
    <div class="lbl">Dimension</div>
    <div class="cnt"><span id="cnt">01</span><span class="of">/04</span></div>
  </div>
  <div class="quad bl">
    <div class="lbl" style="font-size:9px;margin-bottom:4px">System Time</div>
    <div class="time" id="time">—</div>
    <div class="status"><span class="led"></span><span>Link Active</span></div>
  </div>
  <div class="quad br">
    <div class="lbl" style="font-size:9px;margin-bottom:4px">Instruction</div>
    <div class="cta">Scroll to Traverse</div>
  </div>
  <div class="brk tl2"></div><div class="brk tr2"></div><div class="brk bl2"></div><div class="brk br2"></div>
</div>

<!-- Nexus Hero -->
<section class="hero">
  <div class="rings">
    <div class="ring" style="width:25vw;height:25vw;animation-delay:0s"></div>
    <div class="ring" style="width:50vw;height:50vw;animation-delay:.6s"></div>
    <div class="ring" style="width:75vw;height:75vw;animation-delay:1.2s"></div>
    <div class="ring" style="width:100vw;height:100vw;animation-delay:1.8s"></div>
  </div>
  <div class="dial">
    <svg width="60vmin" height="60vmin" viewBox="0 0 400 400">
      <circle cx="200" cy="200" r="198" fill="none" stroke="#F2F2F2" stroke-width=".5" stroke-dasharray="2 6"/>
      <circle cx="200" cy="200" r="150" fill="none" stroke="#F2F2F2" stroke-width=".3"/>
    </svg>
  </div>
  <div style="position:relative;z-index:10;text-align:center;padding:0 24px">
    <div class="tag">A Junction of 4 Dimensions</div>
    <h1><span class="a">SYNAPTIC</span><span class="b">ARCHIVE</span></h1>
    <div class="scroll"><span>Scroll to Traverse</span><div class="bar"></div></div>
  </div>
</section>

<!-- Projects injected here -->
<div id="projects"></div>

<!-- Closing -->
<section class="close">
  <div class="csvg" id="csvg">
    <svg width="80vmin" height="80vmin" viewBox="0 0 400 400" fill="none">
      <circle cx="200" cy="200" r="180" stroke="#F2F2F2" stroke-width=".5" class="draw" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
      <circle cx="200" cy="200" r="120" stroke="#F2F2F2" stroke-width=".5" stroke-dasharray="3 6" class="draw2" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
    </svg>
  </div>
  <div class="wrap" id="closeWrap">
    <div class="lbl">End of Transmission</div>
    <div class="foot">Synaptic Archive · Vector Flow Theory · MMXXVI</div>
  </div>
</section>

<!-- Dimension Viewer -->
<div class="viewer" id="viewer" aria-hidden="true">
  <div class="bar">
    <div class="bar-left">
      <span class="bar-idx" id="viewerIdx">01</span>
      <span class="bar-ttl" id="viewerTtl">—</span>
    </div>
    <div class="bar-right">
      <a class="bar-btn" id="viewerExt" href="#" target="_blank" rel="noopener noreferrer">Open External</a>
      <button type="button" class="bar-btn exit" id="viewerExit" aria-label="Exit Dimension">Exit ×</button>
    </div>
  </div>
  <div class="frame-wrap">
    <div class="loader" id="viewerLoader"><div class="spin"></div><span>Entering Dimension</span></div>
    <iframe id="viewerFrame" title="Dimension View" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<script>
/* ===== サイト文言・リンク編集エリア =====
   title / subtitle / meta / url を書き換えるだけで反映されます。
   タイトル内の改行は <br> を使ってください。
*/
const PROJECTS=[
  {
    id:"angels",
    index:"01",
    title:"夭折した<br>天使たちへ",
    subtitle:"To the Angels Gone Too Soon",
    accent:"#8E9AAF",
    url:"https://yno2jyou.github.io/to-the-angels-gone-too-soon/#/",
    theme:"particles",
    meta:"Lat 35.6762 · Lon 139.6503 · Ethereal Mist"
  },
  {
    id:"factor",
    index:"02",
    title:"FACTOR / TRADER",
    subtitle:"Terminal Matrix",
    accent:"#00FF41",
    url:"https://yno2jyou.github.io/FACTOR-TRADER/",
    theme:"ticker",
    meta:"Volatility 0.847 · Tick 4.2ms · Terminal Green"
  },
  {
    id:"speak",
    index:"03",
    title:"Speak or Die",
    subtitle:"Pulse of Letters",
    accent:"#FF3E00",
    url:"https://yno2jyou.github.io/SorD/#/",
    theme:"pulse",
    meta:"Freq 432Hz · Amplitude 0.91 · Signal Flare"
  },
  {
    id:"index",
    index:"04",
    title:"27°10′48″N",
    subtitle:"147°32′24″E · Index",
    accent:"#6E6E6E",
    url:"https://yno2jyou.github.io/27-10-48-N-147-32-24-E/#/",
    theme:"grid",
    meta:"27°10′48″N · 147°32′24″E · Concrete Neutral"
  }
];

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);

/* ===== Shutter ===== */
setTimeout(()=>{document.getElementById('seam').classList.add('show');document.getElementById('shutterLabel').classList.add('show');},250);
setTimeout(()=>{$('#shutter').classList.add('open');},900);
setTimeout(()=>{$('#shutter').classList.add('gone');},1900);

/* ===== Cursor ===== */
(function(){
  const c=$('#cursor');
  let tx=0,ty=0,cx=0,cy=0;
  window.addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;});
  function loop(){cx+=(tx-cx)*0.18;cy+=(ty-cy)*0.18;c.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;requestAnimationFrame(loop);}
  loop();
  $$('a,.proj .cluster').forEach(el=>{
    el.addEventListener('mouseenter',()=>{c.style.width='64px';c.style.height='64px';});
    el.addEventListener('mouseleave',()=>{c.style.width='40px';c.style.height='40px';});
  });
})();

/* ===== Time ===== */
function tick(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('#time').textContent=`${d.getUTCFullYear()}.${p(d.getUTCMonth()+1)}.${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} UTC`;
}
tick();setInterval(tick,1000);

/* ===== Build warp effects ===== */
function buildWarp(theme,accent){
  const div=document.createElement('div');
  div.className='warp-'+theme;
  if(theme==='particles'){
    for(let i=0;i<28;i++){
      const s=document.createElement('span');
      s.className='p';
      const r=1+Math.random()*3,d=4+Math.random()*8;
      s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${r}px;height:${r}px;background:${accent};animation:float ${d}s ease-in-out ${Math.random()*5}s infinite`;
      div.appendChild(s);
    }
  }else if(theme==='ticker'){
    const syms=["BTC","ETH","NVDA","EUR","JPY","GOLD","OIL","SPX","NDX","DXY"];
    for(let r=0;r<6;r++){
      const row=document.createElement('div');
      row.className='row';
      row.style.cssText=`animation:${r%2?'driftR':'drift'} ${20+r*4}s linear infinite`;
      const cells=[];
      for(let i=0;i<16;i++){
        const sym=syms[(r+i)%syms.length],price=(1000+Math.random()*90000).toFixed(2),up=Math.random()>0.5;
        cells.push(`<span>${sym}<span class="sep">·</span>${price}<span class="${up?'up':'dn'}">${up?' ▲':' ▼'}</span></span>`);
      }
      row.innerHTML=cells.join('')+cells.join('');
      div.appendChild(row);
    }
  }else if(theme==='pulse'){
    const chars="SPEAKORDIE".split('');
    for(let i=0;i<40;i++){
      const s=document.createElement('span');
      s.className='c';
      s.textContent=chars[i%chars.length];
      s.style.cssText=`animation:pulse 1.5s ease-in-out ${(i%10)*0.08}s infinite`;
      div.appendChild(s);
    }
  }else if(theme==='grid'){
    const cells=[];
    for(let i=0;i<192;i++){const on=Math.random()>0.7;cells.push(`<div class="cell ${on?'on':''}"></div>`);}
    div.innerHTML=`<div class="grid">${cells.join('')}</div>`;
    div.querySelectorAll('.cell').forEach((el,i)=>{el.style.animation=`pulse 2s ease-in-out ${(i%20)*0.05}s infinite`;});
    const scope=document.createElement('div');
    scope.className='scope';
    scope.style.cssText=`animation:spin 24s linear infinite`;
    scope.innerHTML=`<svg width="180" height="180" viewBox="0 0 180 180" fill="none"><circle cx="90" cy="90" r="85" stroke="${accent}" stroke-width=".5" stroke-dasharray="2 4"/><circle cx="90" cy="90" r="60" stroke="${accent}" stroke-width=".5"/><circle cx="90" cy="90" r="35" stroke="${accent}" stroke-width=".5" stroke-dasharray="1 3"/><line x1="5" y1="90" x2="175" y2="90" stroke="${accent}" stroke-width=".3"/><line x1="90" y1="5" x2="90" y2="175" stroke="${accent}" stroke-width=".3"/></svg>`;
    div.appendChild(scope);
  }
  return div;
}

/* ===== Build projects ===== */
const projectsHost=$('#projects');
PROJECTS.forEach((p,i)=>{
  const sec=document.createElement('section');
  sec.className='proj';
  sec.dataset.projectIndex=i;
  sec.style.setProperty('--p-accent',p.accent);
  sec.innerHTML=`
    <div class="warp" data-warp></div>
    <div class="bleed" data-bleed style="background:linear-gradient(to top,${p.accent}22,transparent)"></div>
    <div class="idx">${p.index}</div>
    <div class="cluster" data-cluster>
      <div class="skew" data-skew>
        <h2 class="ttl" data-ttl>${p.title}</h2>
      </div>
      <div class="sub" data-sub>${p.subtitle}</div>
      <button type="button" class="enter" data-enter="${i}"><span>Enter Dimension</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
    <div class="meta">${p.meta}</div>
  `;
  const warp=sec.querySelector('[data-warp]');
  warp.appendChild(buildWarp(p.theme,p.accent));
  // set warp opacity default 0
  warp.style.opacity='0';
  warp.style.transition='opacity .5s ease';
  projectsHost.appendChild(sec);

  // hover -> hollow + warp show
  const cluster=sec.querySelector('[data-cluster]');
  const ttl=sec.querySelector('[data-ttl]');
  let raf=null;
  cluster.addEventListener('mouseenter',()=>{ttl.classList.add('hollow');warp.style.opacity='1';});
  cluster.addEventListener('mouseleave',()=>{ttl.classList.remove('hollow');warp.style.opacity='0';mx=0;my=0;ttl.style.transform='';});
  let mx=0,my=0;
  cluster.addEventListener('mousemove',e=>{
    const r=cluster.getBoundingClientRect();
    const dx=(e.clientX-(r.left+r.width/2))/r.width;
    const dy=(e.clientY-(r.top+r.height/2))/r.height;
    mx=dx*24;my=dy*16;
    if(raf)cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{ttl.style.transform=`translate(${mx}px,${my}px)`;});
  });
});

/* ===== Dimension Viewer ===== */
(function(){
  const viewer=$('#viewer');
  const frame=$('#viewerFrame');
  const loader=$('#viewerLoader');
  const vIdx=$('#viewerIdx');
  const vTtl=$('#viewerTtl');
  const vExt=$('#viewerExt');
  const vExit=$('#viewerExit');

  function openViewer(p){
    const plainTitle=p.title.replace(/<br\s*\/?>/gi,' ');
    vIdx.textContent=p.index;
    vTtl.textContent=plainTitle;
    vExt.href=p.url;
    document.documentElement.style.setProperty('--v-accent',p.accent);
    loader.classList.remove('hide');
    frame.src=p.url;
    viewer.classList.add('open');
    viewer.setAttribute('aria-hidden','false');
    document.body.classList.add('viewing');
  }
  function closeViewer(){
    viewer.classList.remove('open');
    viewer.setAttribute('aria-hidden','true');
    document.body.classList.remove('viewing');
    setTimeout(()=>{frame.src='about:blank';loader.classList.remove('hide');},500);
  }
  frame.addEventListener('load',()=>{
    if(frame.src && frame.src!=='about:blank') loader.classList.add('hide');
  });
  vExit.addEventListener('click',closeViewer);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && viewer.classList.contains('open')) closeViewer();
  });
  $$('[data-enter]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=parseInt(btn.getAttribute('data-enter'),10);
      openViewer(PROJECTS[i]);
    });
  });
})();

/* ===== Scroll-driven skew/scale + active tracking ===== */
const accentMap={};
let activeIdx=0;
const sections=$$('.proj');

function applyScroll(){
  const vh=window.innerHeight;
  sections.forEach(sec=>{
    const r=sec.getBoundingClientRect();
    const prog=(r.top+vh)/ (vh*2); // 1 when centered top, 0..1
    // center progress: 0 at bottom entering, .5 centered, 1 at top leaving
    const p=Math.max(0,Math.min(1,1-(r.top+ r.height/2)/(vh+ r.height/2)+0.5));
    // simpler: distance from center
    const mid=r.top+r.height/2;
    const dist=Math.abs(mid-vh/2);
    const norm=Math.min(1,dist/(vh));
    const skew=(1-norm)*0; // skew based on scroll velocity handled separately
    const skewY=(r.top/vh)*0;
    // skew by position: entering from bottom -> +8deg, centered -> 0, leaving top -> -8deg
    const sk = (r.top+ r.height/2 - vh/2)/(vh)*8;
    const sc = 1 - Math.abs(r.top+ r.height/2 - vh/2)/(vh)*0.15;
    const skewEl=sec.querySelector('[data-skew]');
    if(skewEl){skewEl.style.transform=`skewY(${sk}deg) scaleY(${Math.max(.85,sc)})`;}
    const cluster=sec.querySelector('[data-cluster]');
    if(cluster){cluster.style.transform=`translateY(${(r.top+ r.height/2 - vh/2)*-0.08}px)`;}
    // meta opacity
    const op=Math.max(0,1-Math.abs(r.top+ r.height/2 - vh/2)/(vh*0.55));
    sec.querySelector('[data-sub]').style.opacity=op;
    sec.querySelector('[data-bleed]').style.opacity=op*0.8;
    sec.querySelector('.idx').style.opacity=op;
  });
}

function trackActive(){
  const vh=window.innerHeight;
  let best=0,bestDist=Infinity;
  sections.forEach((sec,i)=>{
    const r=sec.getBoundingClientRect();
    const d=Math.abs(r.top+r.height/2 - vh/2);
    if(d<bestDist){bestDist=d;best=i;}
  });
  if(best!==activeIdx){
    activeIdx=best;
    const p=PROJECTS[best];
    document.documentElement.style.setProperty('--accent',p.accent);
    document.documentElement.style.setProperty('--p-accent',p.accent);
    $('#cnt').textContent=String(best+1).padStart(2,'0');
    $('#leak').style.background=`radial-gradient(circle at 50% 100%, ${p.accent}14, transparent 60%)`;
    $('#fil1').setAttribute('stroke',p.accent);
    $('#fil2').setAttribute('stroke',p.accent);
  }
}
// init accent
(function(){const p=PROJECTS[0];document.documentElement.style.setProperty('--accent',p.accent);})();

let ticking=false;
function onScroll(){
  if(!ticking){ticking=true;requestAnimationFrame(()=>{applyScroll();trackActive();ticking=false;});}
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll);
applyScroll();trackActive();

/* ===== Filament draw-in ===== */
setTimeout(()=>{
  const fil=$('#fil2');
  const len=fil.getTotalLength();
  fil.style.strokeDasharray=len;
  fil.style.strokeDashoffset=len;
  fil.style.transition='stroke-dashoffset 3s ease-in-out';
  requestAnimationFrame(()=>{fil.style.strokeDashoffset=0;});
  // restore dash pattern after draw
  setTimeout(()=>{fil.style.transition='none';fil.style.strokeDasharray='4 8';fil.style.strokeDashoffset=0;},3200);
},300);

/* ===== Closing draw-in via IntersectionObserver ===== */
const io=new IntersectionObserver((ents)=>{
  ents.forEach(e=>{
    if(e.isIntersecting){
      $$('.draw, .draw2').forEach((el,i)=>{
        el.style.transition=`stroke-dashoffset 3s ease-in-out ${i*0.3}s`;
        el.style.strokeDashoffset='0';
      });
      $('#closeWrap').style.opacity='0';
      $('#closeWrap').style.transform='translateY(30px)';
      $('#closeWrap').style.transition='opacity 1s ease .2s, transform 1s ease .2s';
      requestAnimationFrame(()=>{$('#closeWrap').style.opacity='1';$('#closeWrap').style.transform='translateY(0)';});
      io.disconnect();
    }
  });
},{threshold:.3});
io.observe($('.close'));
</script>
</body>
</html>
